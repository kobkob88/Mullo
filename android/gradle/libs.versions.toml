[versions]
androidGradlePlugin = "9.0.1"
androidxCore = "1.18.0"
playServicesWearable = "20.0.1"
androidxWebkit = "1.17.1"
androidxWork = "2.10.5"
androidxCredentials = "1.5.0"
googleId = "1.1.1"
wearComplications = "1.2.1"

[libraries]
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidxWork" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidxCredentials" }
androidx-credentials-play = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidxCredentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }

wear-complications-data-source = { module = "androidx.wear.watchface:watchface-complications-data-source", version.ref = "wearComplications" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
