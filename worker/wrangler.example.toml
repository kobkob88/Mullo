# Running your own Mullo Worker? Copy this file to wrangler.toml and fill in YOUR values.
# Mullo's own deployment keeps its wrangler.toml out of the public copy. Nothing secret
# belongs in this file: secrets go in with `npx wrangler secret put NAME` (never a file,
# never .dev.vars). The secrets the Worker reads: GEMINI_API_KEY, STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, OWN_KEY_SECRET, GOOGLE_CLIENT_SECRET, APPLE_SIGNIN_KEY, APPSTORE_KEY.
# A feature whose settings are blank stays off.

name = "echo-api"                 # your Worker's name
main = "src/index.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]   # Buffer, used by bridge/transcribe.mjs

[[d1_databases]]
binding = "DB"
database_name = "echo"
database_id = ""                  # printed by `npx wrangler d1 create echo`

# Send now, collect later (src/jobs.mjs): one Durable Object per transcription.
[[durable_objects.bindings]]
name = "TRANSCRIBE_JOBS"
class_name = "TranscribeJob"

# One cap per address (src/index.mjs overLimit). namespace_id: any number unique in your account.
[[ratelimits]]
name = "PER_IP"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TranscribeJob"]

[vars]
CONNECTIONS_OPEN = "yes"          # MCP and API keys
LEGAL_GATE = "on"                 # AI waits until the current Privacy Policy and Terms are accepted
SIGNIN_GATE = "on"                # a Pro key or own AI key works only with a sign-in beside it
STRIPE_PRICE_ID = ""              # your Stripe price (price_...)
STRIPE_PRODUCT_ID = ""            # your Stripe product (prod_...); the webhook ignores any other
STRIPE_TAX = "off"                # "on" = Stripe Tax adds sales tax at Checkout
STRIPE_PORTAL_CONFIG = ""         # bpc_... (empty = Stripe's default billing portal)
MONTHLY_MINUTES = "1800"          # minutes of recordings a month for a paid plan
MONTHLY_TOKENS = "10000000"       # hidden safety limit per month
AI_PER_MINUTE = "20"
APP_ORIGINS = ""                  # extra origins allowed to call /api (e.g. a phone app's WebView origin)
PRICE_LABEL = "$9.99"
SUPABASE_URL = ""                 # https://<your project>.supabase.co
SUPABASE_PUBLISHABLE_KEY = ""     # sb_publishable_... (public by design; never an sb_secret_ key)
ADMIN_USER_IDS = ""               # Supabase user ids that may open Admin, comma separated
TRIAL_TOKENS_PER_MINUTE = "6000"
GOOGLE_CLIENT_ID = ""             # Google Calendar + Tasks: your Web client id (off while blank)
APPLE_TEAM_ID = ""                # Sign in with Apple: your team id, key id and client id
APPLE_KEY_ID = ""
APPLE_CLIENT_ID = ""
APPLE_PRODUCT_ID = ""             # In-App Purchase product (empty = buying in the iPhone app is off)
APPSTORE_KEY_ID = ""
APPSTORE_ISSUER_ID = ""
GOOGLE_TASKS = "off"              # "on" = also send tasks to Google Tasks

# The web app for computers at /app/, built by `node scripts/build-web.mjs` (never committed).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/app", "/app/*"]

[observability]
enabled = true
