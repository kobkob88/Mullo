<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Capture conversations and voice notes; get summaries and action items.">
  <title>Mullo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="shell-head">
    <span class="shell-head__start">
      <a class="brand" href="#/library">Mullo</a>
      <a class="head-signin" id="head-signin" href="#/settings/account" hidden>Sign in</a>
    </span>
    <span id="pending-badge" class="pending" role="status" hidden></span>
  </header>

  <main id="view" class="view" tabindex="-1">
    <p class="muted">Loading…</p>
  </main>

  <a class="fab" id="record-fab" href="#/record" aria-label="Record" data-action="record-open"></a>

  <nav class="tabbar" aria-label="Main">
    <a class="tabbar__item" href="#/library" data-nav="library"><span class="tabbar__icon" aria-hidden="true">▤</span>Library</a>
    <a class="tabbar__item" href="#/actions" data-nav="actions"><span class="tabbar__icon" aria-hidden="true">✓</span>Actions</a>
    <a class="tabbar__item" href="#/search" data-nav="search"><span class="tabbar__icon" aria-hidden="true"><svg class="tabbar__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20.5 20.5"/></svg></span>Search</a>
    <a class="tabbar__item" href="#/settings" data-nav="settings"><span class="tabbar__icon" aria-hidden="true"><svg class="tabbar__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="2.4"/><path stroke-width="2.6" d="M18.20 12.00 21.20 12.00M16.38 16.38 18.51 18.51M12.00 18.20 12.00 21.20M7.62 16.38 5.49 18.51M5.80 12.00 2.80 12.00M7.62 7.62 5.49 5.49M12.00 5.80 12.00 2.80M16.38 7.62 18.51 5.49"/></svg></span>Settings</a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" data-action="toast-dismiss" hidden></div>
</body>
</html>
