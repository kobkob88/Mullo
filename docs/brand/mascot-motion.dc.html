<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mullo in motion</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9EDDCF}a:hover{color:#C9F0E6}
.mullo .m-body,.mullo .eye,.mullo .chew,.mullo .m-antenna,.mullo .m-bounce,.mullo .bar,.mullo .spark,.mullo .shadow{transform-box:fill-box;transform-origin:50% 100%}
.mullo .eye,.mullo .chew,.mullo .bar,.mullo .spark{transform-origin:50% 50%}
.mullo .v{opacity:0;transition:opacity .18s ease}
.mullo .m-bub{opacity:0}
.st-idle .v-open,.st-idle .v-smile,.st-listening .v-open,.st-listening .v-o,.st-mulling .v-closed,.st-mulling .v-chew,.st-ready .v-closed,.st-ready .v-big,.st-silent .v-open,.st-silent .v-flat,.st-silent .v-dots,.st-offline .v-half,.st-offline .v-flat{opacity:1}
@keyframes mBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes mTalk{0%,100%{transform:scale(1,1)}30%{transform:scale(1.035,.955)}60%{transform:scale(.985,1.02)}}
@keyframes mBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes mSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes mRise{0%{transform:translate(0,0) scale(.3);opacity:0}15%{opacity:.9}100%{transform:translate(46px,-120px) scale(1.1);opacity:0}}
@keyframes mOrbit{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes mChew{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
@keyframes mBar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes mHop{0%,40%,100%{transform:translateY(0)}12%{transform:translateY(-28px)}24%{transform:translateY(0)}31%{transform:translateY(-8px)}}
@keyframes mShadow{0%,40%,100%{transform:scaleX(1);opacity:.3}12%{transform:scaleX(.7);opacity:.15}}
@keyframes mPop{0%,100%{transform:scale(0);opacity:0}15%{transform:scale(1.2);opacity:1}40%{transform:scale(1);opacity:1}60%{transform:scale(0);opacity:0}}
@keyframes mLook{0%,20%,100%{transform:translateX(0)}35%,50%{transform:translateX(-5px)}65%,80%{transform:translateX(5px)}}
@keyframes mDots{0%,100%{opacity:.25}50%{opacity:1}}
.mullo .m-body{animation:mBreathe 3.2s ease-in-out infinite}
.mullo .eye{animation:mBlink 4.4s infinite}
.mullo .m-antenna{animation:mSway 3.6s ease-in-out infinite}
.mullo .bar{opacity:.35}
.st-listening .m-body{animation:mTalk .5s ease-in-out infinite}
.st-listening .m-antenna{animation:mSway 1s ease-in-out infinite}
.st-listening .m-bub{animation:mRise 1.8s ease-out infinite}
.st-listening .m-bub.b2{animation-delay:.6s}
.st-listening .m-bub.b3{animation-delay:1.2s}
.st-listening .bar{opacity:1;animation:mBar .6s ease-in-out infinite}
.st-listening .bar.d1{animation-delay:.1s}.st-listening .bar.d2{animation-delay:.25s}.st-listening .bar.d3{animation-delay:.4s}.st-listening .bar.d4{animation-delay:.15s}
.st-mulling .m-orbit{animation:mOrbit 2.6s linear infinite}
.st-mulling .m-orbit .m-bub{opacity:.8}
.st-mulling .chew{animation:mChew .38s ease-in-out infinite}
.st-mulling .m-body{animation:mBreathe 1.4s ease-in-out infinite}
.st-mulling .bar{opacity:.6;animation:mBar 1.8s ease-in-out infinite}
.st-ready .m-bounce{animation:mHop 2.2s ease-out infinite}
.st-ready .shadow{animation:mShadow 2.2s ease-out infinite}
.st-ready .spark{animation:mPop 2.2s ease-out infinite}
.st-ready .spark.s2{animation-delay:.12s}.st-ready .spark.s3{animation-delay:.24s}
.st-ready .bar{opacity:1}
.st-silent .pupil{animation:mLook 2.8s ease-in-out infinite}
.st-silent .v-dots circle{animation:mDots 1.2s ease-in-out infinite}
.st-silent .v-dots circle:nth-child(2){animation-delay:.2s}.st-silent .v-dots circle:nth-child(3){animation-delay:.4s}
.st-offline .m-antenna{animation:none;transform:rotate(38deg)}
.st-offline .m-body{animation:mBreathe 5s ease-in-out infinite}
.st-offline .tip{fill:#6B7F82}
.st-offline .bar{opacity:.12}
.spark{opacity:0}
@media (prefers-reduced-motion: reduce){.mullo *{animation:none !important}}
</style>
</helmet>

<div style="display: flex; justify-content: space-between; align-items: flex-end">

<span style="font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">{{stateName}}</span>

</div>
<span style="font-family: 'DM Mono', monospace; font-size: 14px; color: #7FA9A2">pure SVG + CSS · no libraries</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 28px; padding-top: 8px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 48px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">mullo<span style="color: #9EDDCF">.</span> moods</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.45; color: #A9C9C3">One character, six states, each tied to something the app is actually doing. Tap one.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{states}}" as="s" hint-placeholder-count="6">
<button type="button" onClick="{{s.pick}}" style="{{s.btnStyle}}">
<span style="font-family: 'DM Mono', monospace; font-size: 13px; width: 22px; opacity: 0.7">{{s.num}}</span>

</sc-for>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'idle' };
  }
  renderVals() {
    const list = [
      { id: 'idle', name: 'Idle', when: 'App open, nothing happening', desc: 'Breathes, blinks, antenna sways.', app: 'Tap to record' },
      { id: 'listening', name: 'Listening', when: 'Recording on phone or watch', desc: 'Bubbles stream up, he bobs to your voice.', app: 'Listening… 0:12' },
      { id: 'mulling', name: 'Mulling', when: 'Transcribing and summarising', desc: 'Eyes shut, chewing, thoughts orbit.', app: 'Mulling it over' },
      { id: 'ready', name: 'Ready', when: 'Summary and tasks are done', desc: 'Hops, sparkles, waves light up.', app: 'Ready: Weekend plan · 3 tasks' },
      { id: 'silent', name: 'No speech', when: 'Silence check found nothing', desc: 'Looks around, a thought trails off.', app: 'No speech heard' },
      { id: 'offline', name: 'Offline', when: 'Connection dropped, ticket kept', desc: 'Antenna droops, bubble goes grey.', app: 'Connection dropped · will retry' }
    ];
    const picked = this.state.picked;
    const cur = list.find((s) => s.id === picked) || list[0];
    const base = 'display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px; padding: 10px 16px; border-radius: 16px; cursor: pointer; font-family: inherit; ';
    const states = list.map((s, i) => ({
      num: '0' + (i + 1),
      name: s.name,
      when: s.when,
      btnStyle: s.id === picked
        ? base + 'background: #9EDDCF; color: #0B181B; border: 1px solid #9EDDCF'
        : base + 'background: transparent; color: #EAF6F3; border: 1px solid #1E3538',
      pick: () => this.setState({ picked: s.id })
    }));
    return {
      rootClass: 'mullo st-' + cur.id,
      states: states,
      stateName: cur.name,
      stateDesc: cur.desc,
      stateCode: 'state="' + cur.id + '"',
      appLine: cur.app,
      ariaLabel: 'Mullo, ' + cur.name.toLowerCase() + ': ' + cur.desc
    };
  }
}
</script>
</body>
</html>
